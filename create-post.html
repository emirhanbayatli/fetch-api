<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <form id="create-post-container">
        <div>
          <h3>Title:</h3>
          <input type="text" id="title" placeholder="Title" required />
        </div>

        <div>
          <h3>Body:</h3>
          <input type="text" id="body" placeholder="Body" required />
        </div>
        <div>
          <button id="create-post-btn" class="button button--success">
            Create New Post
          </button>
          <a href="./index.html" class="button button--success">Turn Back</a>
        </div>
      </form>
    </div>
    <ul id="posts-container">
      <p id="error-message" class="error-message"></p>
    </ul>

    <script src="./create-post.js"></script>
  </body>
</html>
